titolo: CASA | 01
categoria: casa
ordine: 1
sintesi: Cucina e zona giorno rifatte da cima a fondo, dalle murature alla scelta dei materiali.
descrizione: |-
  Ristrutturazione a 360 gradi dell'ambiente cucina e della zona giorno: lo studio è partito da murature, cartongessi, pavimentazione e illuminazione ed è arrivato fino alla scelta dei materiali.

  Progetto e arredamento sono stati realizzati a disegno e prodotti nella nostra falegnameria.

  Nella galleria, l'avanzamento dei lavori: prima, durante e dopo.

titolo: NEGOZIO | ABBIGLIAMENTO
categoria: negozio
ordine: 2
sintesi: Interni progettati e realizzati per un negozio di abbigliamento. Metallo e legno, il freddo e il caldo.
descrizione: |-
  Rifacimento degli interni, dalla progettazione alla realizzazione, per un negozio di abbigliamento.

  Le strutture portanti in metallo dividono gli spazi in maniera funzionale e danno all'ambiente modernità e pulizia. Metallo e legno si fondono, e l'ambiente diventa moderno e passionale insieme.

  Il «freddo» e il «caldo», invece di essere due opposti, qui si combinano.

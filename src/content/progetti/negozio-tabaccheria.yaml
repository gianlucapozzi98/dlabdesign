titolo: NEGOZIO | TABACCHERIA
categoria: negozio
ordine: 3
sintesi: Uno spazio luminoso fatto di ecolegno, laccato, pannelli materici e vetro.
descrizione: |-
  Progettazione e realizzazione di uno spazio adibito a tabaccheria.

  L'alternanza di ecolegno, laccato e pannellature con effetto materico, insieme alla leggerezza del vetro, dà grande luminosità all'ambiente.

  Un attento studio di controsoffitti, illuminazione e colori rende lo spazio moderno, fresco e pulito.

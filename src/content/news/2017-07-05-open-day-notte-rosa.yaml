titolo: Open Day per la Notte Rosa
data: 2017-07-05
sintesi: Dopo la presentazione della collezione «GREEN Project», un Open Day per la Notte Rosa.
testo: |-
  Dopo la presentazione della collezione «GREEN Project», D-Labdesign ha riaperto le porte con un Open Day in occasione della Notte Rosa: giovedì 6 luglio 2017, dalle 18:00.

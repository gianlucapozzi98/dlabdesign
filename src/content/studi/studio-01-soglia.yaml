titolo: Studio 01 — Soglia
ordine: 1
sintesi: Un portale d'ingresso pensato come il primo mobile di casa.
descrizione: |-
  Un esercizio sul momento in cui si entra: un telaio profondo che è insieme porta, seduta e mensola. Il volume pieno accoglie, il taglio vuoto lascia passare la luce.

  È un disegno di studio per mostrare come ragioniamo su volumi e funzioni: non è un lavoro realizzato e non ha misure di progetto.
disegno: soglia
materiali:
  - Legno
  - Metallo
  - Laccato
